name: Release
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: nimvault-linux-amd64
            nim: "2.2.2"
          # nim-lang.org publishes no arm64 builds; the nightlies archive does.
          - os: ubuntu-24.04-arm
            artifact: nimvault-linux-arm64
            nim: "binary:2.2.2"
          - os: macos-latest
            artifact: nimvault-macos-arm64
            nim: "2.2.2"
          # macos-13 (the last Intel image under that label) was removed in
          # December 2025. macos-15-intel is the standard x86_64 runner.
          - os: macos-15-intel
            artifact: nimvault-macos-amd64
            nim: "2.2.2"
          - os: windows-latest
            artifact: nimvault-windows-amd64
            nim: "2.2.2"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: iffy/install-nim@v5
        with:
          version: ${{ matrix.nim }}
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Install MinGW (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://nim-lang.org/download/mingw64.7z -OutFile mingw64.7z
          7z x mingw64.7z -oC:\nim-mingw | Out-Host
          $gcc = Get-ChildItem -Path C:\nim-mingw -Filter gcc.exe -Recurse | Select-Object -First 1
          if (-not $gcc) { throw "gcc.exe not found in the Nim MinGW archive" }
          Add-Content -Path $env:GITHUB_PATH -Value $gcc.DirectoryName
          Write-Host "mingw $($gcc.FullName)"

      - name: Check tag matches package version
        run: |
          TAG=$(git describe --tags --exact-match)
          VER=$(awk '/^version/{gsub(/"/, "", $3); print $3; exit}' nimvault.nimble)
          test "$TAG" = "v$VER"
          grep -q "const Version\\* = \"$VER\"" src/nimvault/version.nim

      - name: Install dependencies
        run: nimble install cligen -y

      - name: Install musl (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools binutils file

      - name: Build release binary
        run: |
          if [ "$(uname -s)" = "Linux" ]; then
            # Fully static musl: no libpcre, glibc, libssl, or other .so.
            nimble build -y -d:release --gcc.exe:musl-gcc --gcc.linkerexe:musl-gcc --passL:-static
          elif [ "$RUNNER_OS" = "Windows" ]; then
            nimble build -y -d:release --passL:-static-libgcc
          else
            nimble build -y -d:release
          fi

      - name: Confirm the Linux binary is static
        if: runner.os == 'Linux'
        run: |
          file bin/nimvault | grep -E 'statically linked|static-pie linked'
          case "${{ matrix.artifact }}" in
            *arm64*) file bin/nimvault | grep -E 'aarch64|ARM aarch64' ;;
            *amd64*) file bin/nimvault | grep -E 'x86-64|x86_64' ;;
          esac
          if ldd bin/nimvault 2>&1 | grep -E 'libpcre|libssl|libcrypto|=>'; then
            echo "unexpected dynamic dependency"
            exit 1
          fi
          if strings bin/nimvault | grep -E 'libpcre\.so|libssl\.so|libcrypto\.so'; then
            echo "binary still names a shared library"
            exit 1
          fi

      - name: Confirm the macOS binary architecture
        if: runner.os == 'macOS'
        run: |
          case "${{ matrix.artifact }}" in
            *arm64*)
              test "$(uname -m)" = "arm64"
              file bin/nimvault | grep -E 'arm64|aarch64'
              ;;
            *amd64*)
              test "$(uname -m)" = "x86_64"
              file bin/nimvault | grep x86_64
              ;;
          esac

      - name: Package release asset
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            test -f bin/nimvault.exe
            python - "${{ matrix.artifact }}" <<'PY'
          import sys, zipfile, struct
          name = sys.argv[1]
          src = "bin/nimvault.exe"
          dst = f"bin/{name}.zip"
          with zipfile.ZipFile(dst, "w", compression=zipfile.ZIP_DEFLATED) as z:
              z.write(src, "nimvault.exe")
          with zipfile.ZipFile(dst) as z:
              names = z.namelist()
              if names != ["nimvault.exe"]:
                  raise SystemExit(f"zip entries {names}")
              data = z.read("nimvault.exe")
          if data[:2] != b"MZ":
              raise SystemExit("not a PE")
          pe = struct.unpack_from("<I", data, 0x3C)[0]
          if data[pe:pe+4] != b"PE\0\0":
              raise SystemExit("bad PE signature")
          machine = struct.unpack_from("<H", data, pe+4)[0]
          if machine != 0x8664:
              raise SystemExit(f"expected x86_64, got {machine:#x}")
          print(f"packed {dst} machine={machine:#x} bytes={len(data)}")
          PY
          else
            test -f bin/nimvault
            mv bin/nimvault "bin/${{ matrix.artifact }}"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ runner.os == 'Windows' && format('bin/{0}.zip', matrix.artifact) || format('bin/{0}', matrix.artifact) }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist-raw

      - name: Write SHA256SUMS
        run: |
          set -eu
          mkdir -p dist
          cp -a dist-raw/nimvault-linux-amd64/nimvault-linux-amd64 dist/
          cp -a dist-raw/nimvault-linux-arm64/nimvault-linux-arm64 dist/
          cp -a dist-raw/nimvault-macos-arm64/nimvault-macos-arm64 dist/
          cp -a dist-raw/nimvault-macos-amd64/nimvault-macos-amd64 dist/
          cp -a dist-raw/nimvault-windows-amd64/nimvault-windows-amd64.zip dist/
          python3 - <<'PY'
          import zipfile
          z = zipfile.ZipFile("dist/nimvault-windows-amd64.zip")
          names = z.namelist()
          if names != ["nimvault.exe"]:
              raise SystemExit(f"zip entries {names}")
          PY
          cd dist
          files="nimvault-linux-amd64 nimvault-linux-arm64 nimvault-macos-arm64 nimvault-macos-amd64 nimvault-windows-amd64.zip"
          for f in $files; do
            test -f "$f"
          done
          # shellcheck disable=SC2086
          sha256sum $files | LC_ALL=C sort -k2 > SHA256SUMS
          sha256sum -c SHA256SUMS
          test "$(wc -l < SHA256SUMS)" -eq 5

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/nimvault-linux-amd64
            dist/nimvault-linux-arm64
            dist/nimvault-macos-arm64
            dist/nimvault-macos-amd64
            dist/nimvault-windows-amd64.zip
            dist/SHA256SUMS
          generate_release_notes: true
