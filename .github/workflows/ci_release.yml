name: Release
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: nimvault-linux-amd64
          - os: macos-latest
            artifact: nimvault-macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: iffy/install-nim@v5
        with:
          version: "2.2.2"

      - name: Check tag matches package version
        run: |
          TAG=$(git describe --tags --exact-match)
          VER=$(awk '/^version/{gsub(/"/, "", $3); print $3; exit}' nimvault.nimble)
          test "$TAG" = "v$VER"
          grep -q "const Version\\* = \"$VER\"" src/nimvault/version.nim

      - name: Install dependencies
        run: nimble install cligen -y

      - name: Build release binary
        run: nimble build -y -d:release

      - name: Rename binary with platform suffix
        run: mv bin/nimvault bin/${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: bin/${{ matrix.artifact }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            nimvault-linux-amd64/*
            nimvault-macos-arm64/*
          generate_release_notes: true
